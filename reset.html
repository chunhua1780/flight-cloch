<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Flight Assist 更新</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b1220;color:#e9eef7;font-family:-apple-system,"PingFang SC",sans-serif;text-align:center}div{font-size:20px;line-height:1.6;padding:20px}small{color:#8d9ab3;font-size:14px}</style></head>
<body><div id="m">正在清除旧版本…<br><small>OFP、授权表和设置都会保留</small></div>
<script>
// 删掉 iPad 上所有旧的离线版本（不删 OFP / 授权表 / 设置），然后打开最新版
(async function () {
  try { const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(r => r.unregister())); } catch (e) {}
  try { const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); } catch (e) {}
  document.getElementById('m').innerHTML = '✅ 已清除旧版本，正在打开最新版…';
  setTimeout(function () { location.replace('assist/?fresh=' + Date.now()); }, 800);
})();
</script></body></html>
